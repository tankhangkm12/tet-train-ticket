server:
  port: ${SERVER_PORT:8080}

app:
  jwt-public-key: ${JWT_PUBLIC_KEY:}
  queue-admit-rate: ${APP_QUEUE_ADMIT_RATE:100}

spring:
  application:
    name: tet-train-ticket
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:api}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tet_ticket}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
      minimum-idle: 2
      initialization-fail-timeout: -1
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
